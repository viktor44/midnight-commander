name: Build Midnight Commander (macOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Midnight Commander version to build'
        required: false
        default: '4.8.33'

env:
  MC_VERSION: ${{ github.event.inputs.mc_version || '4.8.33' }}
  # Runners have no TERM, and mc refuses to start without one.
  TERM: xterm

jobs:
  build:
    name: macOS arm64
    runs-on: macos-26
    permissions:
      contents: write   # needed only by the release step on tag pushes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Source tarballs never change once released, so key the cache on the
      # versions pinned in the build script.
      - name: Cache source tarballs
        uses: actions/cache@v6
        with:
          path: tmp/srcdir
          key: mc-src-${{ runner.os }}-${{ hashFiles('scripts/build-mc-macos.sh') }}-${{ env.MC_VERSION }}

      - name: Build
        run: sh ./scripts/build-mc-macos.sh
        env:
          MC_VERSION: ${{ env.MC_VERSION }}

      - name: Package
        id: package
        run: |
          set -eu
          arch=$(uname -m)
          name="mc-${MC_VERSION}-macos-${arch}"

          # mc has /usr/local baked in as its prefix, so an archive unpacked
          # anywhere else cannot find its skins, syntax files or help, and
          # startup fails with "Unable to load 'default' skin". MC_DATADIR is
          # the supported override, so replace each program in bin/ with a
          # launcher that sets it relative to the archive and move the real
          # binaries aside as *.bin. mc picks its mode from basename(argv[0]),
          # hence one wrapper per name rather than a single shared one.
          prefix=tmp/stagedir/usr/local
          for prog in mc mcedit mcview mcdiff; do
            # mcedit and friends ship as symlinks to mc; resolve them so each
            # .bin is a real file and the wrapper below keeps its own name.
            target=$(cd "$prefix/bin" && pwd)/$prog
            [ -e "$target" ] || continue
            cp "$(readlink -f "$target" 2>/dev/null || echo "$target")" "$prefix/bin/$prog.bin"
            rm -f "$target"
            cat > "$target" <<WRAPPER
          #!/bin/sh
          # Portable launcher: run $prog from wherever this archive was unpacked.
          bindir=\$(cd "\$(dirname "\$0")" && pwd)
          prefix=\$(cd "\$bindir/.." && pwd)
          export MC_DATADIR="\$prefix/share/mc"
          export TERMINFO_DIRS="\$prefix/share/terminfo:\${TERMINFO_DIRS:-/usr/share/terminfo}"
          exec "\$bindir/$prog.bin" "\$@"
          WRAPPER
            chmod +x "$target"
          done

          tar czf "${name}.tar.gz" -C tmp/stagedir/usr/local .
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # Unpack somewhere that is not /usr/local and check the packaged tree
      # works there: this is exactly the case the wrapper exists for, and the
      # in-tree smoke test cannot catch it because it sets MC_DATADIR itself.
      - name: Verify the archive runs unpacked elsewhere
        run: |
          set -eu
          dest="$RUNNER_TEMP/mc-unpacked"
          mkdir -p "$dest"
          tar xzf "${{ steps.package.outputs.name }}.tar.gz" -C "$dest"

          "$dest/bin/mc" --version

          # mc still starts after "Unable to load 'default' skin", so the exit
          # status proves nothing - drive the UI and look for the message.
          out=$(expect -c "
            set timeout 30
            spawn $dest/bin/mc --nomouse
            expect {
              -re {Left|File|Command} { }
              timeout { puts {UI did not appear}; exit 1 }
              eof     { puts {mc exited at startup}; exit 1 }
            }
            send \"\033\[21~\"
            expect {
              -re {[Yy]es} { send \"\r\"; expect eof }
              eof          { }
              timeout      { puts {mc did not quit}; exit 1 }
            }
          ")
          printf '%s\n' "$out" | head -5
          if printf '%s' "$out" | grep -q "Unable to load"; then
            echo "the unpacked tree cannot find its skins" >&2
            exit 1
          fi
          echo "archive runs correctly outside /usr/local"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
