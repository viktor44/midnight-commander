name: Build Midnight Commander (macOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Midnight Commander version to build'
        required: false
        default: '4.8.33'

env:
  MC_VERSION: ${{ github.event.inputs.mc_version || '4.8.33' }}
  # Runners have no TERM, and mc refuses to start without one.
  TERM: xterm

jobs:
  build:
    name: macOS arm64
    runs-on: macos-26
    permissions:
      contents: write   # needed only by the release step on tag pushes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Source tarballs never change once released, so key the cache on the
      # versions pinned in the build script.
      - name: Cache source tarballs
        uses: actions/cache@v6
        with:
          path: tmp/srcdir
          key: mc-src-${{ runner.os }}-${{ hashFiles('scripts/build-mc-macos.sh') }}-${{ env.MC_VERSION }}

      - name: Build
        run: sh ./scripts/build-mc-macos.sh
        env:
          MC_VERSION: ${{ env.MC_VERSION }}

      - name: Package
        id: package
        run: |
          set -eu
          arch=$(uname -m)
          name="mc-${MC_VERSION}-macos-${arch}"

          # mc has /usr/local baked in as its prefix, so an archive unpacked
          # anywhere else cannot find its skins, syntax files or help, and
          # startup fails with "Unable to load 'default' skin". MC_DATADIR is
          # the supported override, so move the binary aside as mc.bin and take
          # over the program names with a launcher that sets it.
          #
          # mc chooses viewer, editor or diff mode from basename(argv[0]), and
          # a shell cannot exec with an argv[0] of its own choosing - so every
          # mode needs a distinct .bin name to exec. They are all symlinks to
          # the one real binary, and so are the four program names: the single
          # launcher works out which is which from its own name.
          prefix=tmp/stagedir/usr/local
          mv "$prefix/bin/mc" "$prefix/bin/mc.bin"
          cat > "$prefix/bin/mc-launcher" <<'WRAPPER'
          #!/bin/sh
          # Portable launcher: run mc from wherever this archive was unpacked.
          # Invoked through the mc, mcedit, mcview and mcdiff symlinks.
          prog=$(basename "$0")

          # Follow symlinks by hand so that a link made from elsewhere, say
          # ~/bin/mc -> /opt/mc/bin/mc, still resolves the archive's own bin
          # directory. readlink -f is not portable enough to rely on here.
          self=$0
          while [ -L "$self" ]; do
            link=$(readlink "$self")
            case $link in
              /*) self=$link ;;
              *)  self=$(dirname "$self")/$link ;;
            esac
          done

          bindir=$(cd "$(dirname "$self")" && pwd)
          prefix=$(cd "$bindir/.." && pwd)
          export MC_DATADIR="$prefix/share/mc"
          export TERMINFO_DIRS="$prefix/share/terminfo:${TERMINFO_DIRS:-/usr/share/terminfo}"
          exec "$bindir/$prog.bin" "$@"
          WRAPPER
          chmod +x "$prefix/bin/mc-launcher"
          for prog in mc mcedit mcview mcdiff; do
            [ "$prog" = mc ] || ln -sf mc.bin "$prefix/bin/$prog.bin"
            rm -f "$prefix/bin/$prog"
            ln -s mc-launcher "$prefix/bin/$prog"
          done

          tar czf "${name}.tar.gz" -C tmp/stagedir/usr/local .
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
